services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trt_extractor_smoke
      POSTGRES_USER: trt_extractor_dev
      POSTGRES_PASSWORD: trt_extractor_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trt_extractor_dev -d trt_extractor_smoke"]
      interval: 1s
      timeout: 5s
      retries: 10
