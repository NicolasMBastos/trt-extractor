name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Suíte normal. Tem que ficar verde. Nunca toca tribunal de produção:
  # `-m "not rede"` exclui tudo que exige credencial ou rede real.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,pdf]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest -m "not rede and not portao"

  # Portões de fase. Falham DE PROPÓSITO até a pendência ser cumprida — hoje,
  # `config/keywords.yaml` vazio. Separado da suíte para não deixar o CI
  # permanentemente vermelho (CI vermelho crônico é CI ignorado), mas visível.
  portoes:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Portões pendentes
        run: pytest -m "portao" -rA

  # Guarda de segredo. O .gitignore exclui credenciais, certificados e PDFs;
  # este job garante que ninguém contornou com `git add -f`.
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum artefato ou credencial versionado
        run: |
          set -euo pipefail
          padrao='\.(pfx|p12|pem|key|crt|cer|der|jks|keystore|pdf)$|(^|/)\.env($|\.)|storage_state|pjeoffice-pro\.config'
          if git ls-files | grep -Ei "$padrao"; then
            echo "::error::Arquivo proibido versionado (credencial, certificado ou PDF)."
            exit 1
          fi
          echo "OK: nenhum arquivo proibido no índice."

      - name: HAR bruto não versionado
        run: |
          set -euo pipefail
          if git ls-files 'research/har/*.har' | grep -v '\.sanitized\.har$' | grep .; then
            echo "::error::HAR bruto versionado. HAR carrega Authorization, cookies e conteúdo de processo."
            echo "Versionar apenas *.sanitized.har — ver docs/fase-0/plano.md."
            exit 1
          fi
          echo "OK: nenhum HAR bruto no índice."
