[project]
name = "trt-extractor"
version = "0.0.1"
description = "Aquisição em volume de peças processuais (PDF) dos 24 TRTs"
readme = "README.md"
# Fixado em 3.12, não 3.12+: a máquina tem 3.14.3, e zeep/playwright/ocrmypdf/
# psycopg têm histórico de atraso em wheels para minor novo. Ver arquitetura §2 (D6).
requires-python = ">=3.12,<3.13"

dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "psycopg[binary,pool]>=3.1",
    "tenacity>=8.2",           # backoff exponencial com jitter
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Instalados por camada: nada de arrastar Playwright para quem só roda os testes.
soap    = ["zeep>=4.2"]                          # via 1 — MNI
browser = ["playwright>=1.44"]                   # vias 0/4 — handshake e in-page fetch
pdf     = ["pypdf>=4.2", "pdfplumber>=0.11"]     # split e detecção de camada de texto
ocr     = ["ocrmypdf>=16.0"]                     # fila separada, nunca inline
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",   # fixtures VCR — zero teste contra tribunal real
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trt_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    # Marcador para o que toca rede real. NUNCA roda no CI — o briefing é
    # explícito: zero teste que bate em tribunal de produção.
    "rede: exige rede/credencial real; excluído do CI (-m 'not rede')",
    "portao: portão de fase; falha de propósito até a pendência ser cumprida",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/trt_extractor"]
